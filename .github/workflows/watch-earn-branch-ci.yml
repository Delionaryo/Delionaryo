name: Watch & Earn Branch CI

on:
  push:
    branches:
      - watch-earn-ui-integration
  pull_request:
    branches:
      - main
    paths:
      - 'src/watchEarn.ts'
      - 'src/watchEarnDraftEditor.ts'
      - 'src/watchEarnOwner.ts'
      - 'src/main.ts'
      - 'package.json'
      - '.github/workflows/watch-earn-branch-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
